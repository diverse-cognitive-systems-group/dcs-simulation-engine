# METADATA
name: HITL
description: |
  A DCS-SE run configuration for easy character evaluation work.

# USER INTERFACE OPTIONS
ui:
  registration_required: false

# GAMES INCLUDED
games:
  - name: Explore
    overrides:
      # max_playtime: 604800 # 1 week
      max_playtime: 2592000 # 1 month (30 days; character evals can take a while - it sucks to have to restart/redo the whole eval if the engine server times out so best to keep it ridiculously long for now)
  - name: Infer Intent
  - name: Foresight
  - name: Goal Horizon
  - name: Teamwork

# NEXT GAME STRATEGY
next_game_strategy:
  strategy:
    id: full_character_access
    allow_choice_if_multiple: true
    require_completion: false

# DATA COLLECTION FORMS
forms: null
