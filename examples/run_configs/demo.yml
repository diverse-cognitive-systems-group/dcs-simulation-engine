# METADATA
name: Demo
description: |
  A DCS-SE demo where players choose a gameplay setup and play for a limited time to get a feel for the experience. No registration, forms, or data collection.

# USER INTERFACE OPTIONS
ui:
  registration_required: false

# GAMES INCLUDED
games:
  - name: Explore
    overrides:
      max_playtime: 300 # 5min
  - name: Infer Intent
    overrides:
      max_playtime: 300 # 5min
  - name: Foresight
    overrides:
      max_playtime: 300 # 5min
  - name: Goal Horizon
    overrides:
      max_playtime: 300 # 5min
  - name: Teamwork
    overrides:
      max_playtime: 300 # 5min

# NEXT GAME STRATEGY
next_game_strategy:
  strategy:
    id: full_character_access
    allow_choice_if_multiple: true
    require_completion: false

# DATA COLLECTION FORMS
forms: null
