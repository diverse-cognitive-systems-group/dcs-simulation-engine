# METADATA
name: Benchmark AI Performance
description: |
  An engine run configuration used for benchmarking AI model performance across games and characters. Model players are provided to the engine command and executed by the run harness.

seed: 42

# USER INTERFACE OPTIONS
ui:
  registration_required: true

# GAMES INCLUDED
games:
  - name: Infer Intent
    overrides:
      # or false if you don't want the AI to learn from game scores
      show_final_score: true
  - name: Foresight
    overrides:
      show_final_score: true
  - name: Goal Horizon
    overrides:
      show_final_score: true
  - name: Teamwork
    overrides:
      show_final_score: true

# NEXT GAME STRATEGY
next_game_strategy:
  strategy:
    id: next_incomplete_combination
    allow_choice_if_multiple: false
    require_completion: true

# DATA COLLECTION FORMS
forms: null
